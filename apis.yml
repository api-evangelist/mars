apis:
  - aid: mars:developer-portal
    name: Mars Developer Portal
    description: >-
      Mars exposes a public Azure-API-Management developer portal at
      developer.mars.com that hosts APIs and API Products for partners,
      suppliers, and B2B integrations. The catalog itself sits behind a
      registration / sign-in flow; consumers subscribe to one or more API
      Products to receive subscription keys for use against the gateway.
      Specific API names and endpoint surfaces are not publicly enumerated
      and require partner onboarding to discover in full.
    humanURL: https://developer.mars.com/
    tags:
      - B2B Integration
      - Partner APIs
      - Supplier APIs
      - Azure API Management
    properties:
